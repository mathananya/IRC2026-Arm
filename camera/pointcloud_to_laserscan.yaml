
pointcloud_to_laserscan:
  ros__parameters:
    min_height: 0.05
    max_height: 0.6

    angle_min: -1.5707963   # -90 deg
    angle_max: 1.5707963    #  90 deg
    angle_increment: 0.0087 # ~0.5 degree resolution
    scan_time: 0.0333       # matches ~30 Hz depth stream

    range_min: 0.2
    range_max: 5.0          # keep consistent with threshold_filter.max_distance above

    use_inf: true
    
    target_frame: "base_link"
    transform_tolerance: 0.02

    concurrency_level: 1
