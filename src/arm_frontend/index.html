<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRISS Arm Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>CRISS Arm Dashboard</h1>
            <div style="display: flex; gap: 1rem;">
                <div class="status-indicator">
                    <div class="status-dot" id="busy-dot"></div>
                    <span id="busy-text">Idle</span>
                </div>
                <div class="status-indicator">
                    <div class="status-dot ik-dot" id="ik-dot"></div>
                    <span id="ik-text">IK ON</span>
                </div>
            </div>
        </header>

        <main class="grid-layout">
            <!-- Telemetry Card -->
            <section class="card glass-card">
                <h2>Telemetry</h2>
                <div class="telemetry-grid">
                    <div class="data-point">
                        <span class="label">Alpha (Lower)</span>
                        <span class="value" id="alpha-val">0.00&deg;</span>
                    </div>
                    <div class="data-point">
                        <span class="label">Beta (Upper)</span>
                        <span class="value" id="beta-val">0.00&deg;</span>
                    </div>
                    <div class="data-point">
                        <span class="label">Current X</span>
                        <span class="value" id="x-val">0.00</span>
                    </div>
                    <div class="data-point">
                        <span class="label">Current Z</span>
                        <span class="value" id="z-val">0.00</span>
                    </div>
                </div>
            </section>

            <!-- Absolute Control Card -->
            <section class="card glass-card">
                <h2>Absolute Control</h2>
                <form id="abs-control-form">
                    <div class="input-group">
                        <label for="target-x">Target X</label>
                        <input type="number" step="0.1" id="target-x" placeholder="e.g. 10.5">
                    </div>
                    <div class="input-group">
                        <label for="target-z">Target Z</label>
                        <input type="number" step="0.1" id="target-z" placeholder="e.g. 5.0">
                    </div>
                    <button type="submit" class="btn primary-btn" id="go-btn">Go to Position</button>
                </form>
                 <button class="btn secondary-btn toggle-ik-btn" id="toggle-ik-btn">Toggle IK Mode</button>
            </section>

            <!-- Relative Control Card -->
            <section class="card glass-card relative-control">
                <h2>Incremental Control (±100)</h2>
                <div class="dpad-grid">
                    <div></div>
                    <button class="btn dpad-btn" id="z-up-btn">+100 Z (Up)</button>
                    <div></div>
                    <button class="btn dpad-btn" id="x-down-btn">-100 X (Left)</button>
                    <div class="dpad-center"></div>
                    <button class="btn dpad-btn" id="x-up-btn">+100 X (Right)</button>
                    <div></div>
                    <button class="btn dpad-btn" id="z-down-btn">-100 Z (Down)</button>
                    <div></div>
                </div>
            </section>
        </main>
    </div>
    
    <!-- Status Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
